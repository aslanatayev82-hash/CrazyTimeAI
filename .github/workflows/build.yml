buname: CrazyTimeAI APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu yukle
        uses: actions/checkout@v4

      - name: Java 17 qur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle qur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK yarat
        run: gradle :app:assembleDebug

      - name: APK saxla
        uses: actions/upload-artifact@v4
        with:
          name: CrazyTimeAI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found::
